{# Страница входа: заголовок «Вход», одно сообщение об ошибке, форма блокируется после 5 неудачных попыток #}
{% extends "sqladmin/base.html" %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100">
  <form class="col-lg-4 col-md-6 card card-md" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">Вход</h2>
      {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}
      <fieldset {% if locked %}disabled{% endif %}>
        <div class="mb-3">
          <label class="form-label" for="username">Логин</label>
          <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-2">
          <label class="form-label" for="password">Пароль</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </div>
      </fieldset>
    </div>
  </form>
</div>
{% endblock %}
