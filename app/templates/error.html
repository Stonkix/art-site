{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — {{ settings.site_name }}{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<section class="container narrow status-page">
  <p class="status-code">{{ code }}</p>
  <h1>Что-то пошло не так</h1>
  <p class="lead">Попробуйте обновить страницу или позвоните: <a href="{{ settings.phone_href }}">{{ settings.phone }}</a></p>
  <a class="btn btn-primary" href="/">На главную</a>
</section>
{% endblock %}
