# /etc/nginx/sites-available/artsite  →  ln -s в sites-enabled
# DOMAIN замените на домен сайта. Пока домен не куплен — на поддомен, например site2.corelms.online.
# После того как домен смотрит на сервер: sudo certbot --nginx -d DOMAIN (добавит HTTPS и редирект)

limit_req_zone $binary_remote_addr zone=artsite_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=artsite_lead:10m rate=10r/m;

upstream artsite_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name DOMAIN;

    client_max_body_size 80m;  # фото картин в хорошем качестве

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /static/ {
        alias /srv/artsite/app/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /srv/artsite/media/;
        expires 30d;
        access_log off;
    }

    location = /admin/login {
        limit_req zone=artsite_login burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://artsite_app;
    }
    location = /lead {
        limit_req zone=artsite_lead burst=5 nodelay;
        include /etc/nginx/proxy_params;
        proxy_pass http://artsite_app;
    }
    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://artsite_app;
    }
}
